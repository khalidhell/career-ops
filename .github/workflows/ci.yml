
name: CareerOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/render-private-deployment]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Typecheck
        working-directory: web
        run: npm run typecheck
 
      - name: Build
        working-directory: web
        run: npm run build  
