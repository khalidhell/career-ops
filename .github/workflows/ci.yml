name: CareerOps CI

on:
  pull_request:
    branches:
      - codex/render-private-deployment
  push:
    branches:
      - main
      - codex/render-private-deployment

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Web tests import shared modules from the repository root.
      # Make the web dependency tree visible to those root-level modules.
      - name: Link web dependencies for shared modules
        run: ln -s "$GITHUB_WORKSPACE/web/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build
